; ====================================================================
; PlatformIO Configuration - AgriEdge OS / Cámara Fungi Industrial
; Configuración para Producción (Release) y Desarrollo Local (Dev)
; ====================================================================

[platformio]
default_envs = esp32_release

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv

lib_deps =
    mobizt/Firebase ESP32 Client @ ^4.4.14
    bblanchon/ArduinoJson @ ^6.21.3
    beegee-tokyo/DHT sensor library for ESPx @ ^1.19
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
    mathieucarbou/ESPAsyncWebServer @ ^3.3.22
    br3ttb/PID @ ^1.2.1

; ── PERFIL PRODUCCIÓN (RELEASE) ───────────────────────────────────────
; - Desactiva logs internos verbosos del core ESP32 (-DCORE_DEBUG_LEVEL=0)
; - Aplica optimización de tamaño y velocidad (-Os)
; - Protege la memoria SRAM y ciclos de reloj para máxima estabilidad
[env:esp32_release]
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Os
    -DNDEBUG
upload_speed = 460800

; ── PERFIL DESARROLLO (DEV) ──────────────────────────────────────────
; - Habilita logs informativos completos para depuración por Serial Monitor
[env:esp32_dev]
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DDEBUG_ESP_PORT=Serial
upload_speed = 460800